[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "media-archive"
version = "0.1.0"
description = "Local-first media archival and presentation toolkit"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
whatsapp = ["playwright>=1.48,<2"]
photos = ["pillow>=10"]
